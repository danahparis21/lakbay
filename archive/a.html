<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAKBAY — Wilderness Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --ink:       #111318;
      --ink-2:     #2e3138;
      --ink-3:     #5a5f6b;
      --ink-4:     #9098a6;
      --ink-5:     #c4c9d4;
      --paper:     #f4f5f7;
      --paper-2:   #eceef2;
      --paper-3:   #e2e5ea;
      --line:      rgba(60,70,90,0.1);
      --accent:    #4a6741;
      --accent-lt: rgba(74,103,65,0.10);
      --warn:      #b94040;
      --r: 0px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    ::-webkit-scrollbar { width:3px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--ink-5); border-radius:2px; }

    html, body {
      height:100%; width:100%;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      overflow: hidden;
    }

    .app {
      position:relative; z-index:1;
      display:grid;
      grid-template-columns: 220px 1fr;
      grid-template-rows: 100vh;
      height:100vh;
      width:100vw;
      overflow:hidden;
    }

    /* ══════════════════════════
       SIDEBAR
    ══════════════════════════ */
    .sidebar {
      display:flex;
      flex-direction:column;
      padding: 36px 0 28px;
      border-right: 1px solid var(--line);
      background: #ffffff;
      overflow: hidden;
      position:relative;
    }
    .sidebar::after {
      content:'';
      position:absolute;
      bottom:0; left:0; right:0;
      height:200px;
      background: linear-gradient(to top, rgba(74,103,65,0.03), transparent);
      pointer-events:none;
    }

    .logo {
      padding: 0 28px 36px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 28px;
    }
    .logo-wordmark {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--ink);
      display:flex;
      align-items:center;
      gap: 10px;
    }
    .logo-icon {
      width: 28px; height: 28px;
      display:flex; align-items:center; justify-content:center;
    }
    .logo-icon svg { width:100%; height:100%; }
    .logo-sub {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-4);
      margin-top: 6px;
      margin-left: 38px;
    }

    .nav-section-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-4);
      padding: 0 28px 10px;
    }

    .nav-list {
      list-style:none;
      flex:1;
      padding: 0 12px;
      display:flex;
      flex-direction:column;
      gap: 2px;
    }
    .nav-item {
      display:flex;
      align-items:center;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 8px;
      cursor:pointer;
      transition: background 0.2s, color 0.2s;
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--ink-3);
      letter-spacing: 0.01em;
      white-space:nowrap;
    }
    .nav-item i {
      width:16px;
      font-size: 0.75rem;
      color: var(--ink-4);
      transition: color 0.2s;
      text-align:center;
      flex-shrink:0;
    }
    .nav-item:hover {
      background: var(--paper-3);
      color: var(--ink);
    }
    .nav-item:hover i { color: var(--ink-3); }
    .nav-item.active {
      background: var(--ink);
      color: var(--paper);
      font-weight: 500;
    }
    .nav-item.active i { color: var(--ink-5); }

    .nav-divider {
      height:1px;
      background: var(--line);
      margin: 14px 12px;
    }

    .sidebar-footer {
      padding: 0 28px;
      font-family: 'DM Mono', monospace;
      font-size: 0.58rem;
      color: var(--ink-5);
      letter-spacing: 0.1em;
      display:flex;
      align-items:center;
      gap: 8px;
    }
    .status-dot {
      width:5px; height:5px;
      border-radius:50%;
      background: var(--accent);
      animation: pulse 2.5s infinite;
    }
    @keyframes pulse {
      0%,100%{ opacity:1; }
      50%{ opacity:0.3; }
    }

    /* ══════════════════════════
       MAIN CONTENT
    ══════════════════════════ */
    .main {
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    /* ── TOPBAR ── */
    .topbar {
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 20px 36px;
      border-bottom: 1px solid var(--line);
      flex-shrink:0;
    }
    .page-heading {
      font-family: 'Inter', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.02em;
      display:flex;
      align-items:center;
      gap: 10px;
    }
    .page-heading i {
      font-size: 0.9rem;
      color: var(--ink-4);
    }
    .topbar-right {
      display:flex;
      align-items:center;
      gap: 20px;
    }
    .topbar-date {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--ink-4);
      letter-spacing: 0.08em;
    }
    .topbar-user {
      display:flex;
      align-items:center;
      gap: 8px;
      padding: 6px 14px 6px 8px;
      border: 1px solid var(--line);
      border-radius: 40px;
      font-size: 0.75rem;
      color: var(--ink-2);
      cursor:pointer;
      transition: background 0.15s;
    }
    .topbar-user:hover { background: var(--paper-2); }
    .avatar {
      width:24px; height:24px;
      border-radius:50%;
      background: var(--ink);
      display:flex; align-items:center; justify-content:center;
      font-size:0.6rem;
      color: var(--paper);
      font-weight:600;
    }

    /* ── CONTENT AREA ── */
    .content {
      flex:1;
      overflow-y:auto;
      padding: 32px 36px 40px;
    }

    /* ══════════════════════════
       REUSABLE COMPONENTS
    ══════════════════════════ */

    /* STAT CARDS */
    .stat-grid {
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px 22px;
      transition: box-shadow 0.2s, transform 0.2s;
      cursor: default;
    }
    .stat-card:hover {
      box-shadow: 0 8px 24px rgba(0,0,0,0.07);
      transform: translateY(-1px);
    }
    .stat-label {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
      color: var(--ink-3);
      margin-bottom: 10px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .stat-label i { font-size:0.7rem; }
    .stat-num {
      font-family: 'Inter', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      line-height:1;
      color: var(--ink);
      letter-spacing: -0.03em;
    }
    .stat-sub {
      font-size: 0.72rem;
      color: var(--ink-4);
      margin-top: 6px;
    }
    .stat-trend {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--accent);
      margin-top: 8px;
    }
    .stat-trend.warn { color: var(--warn); }

    /* SECTION HEADER */
    .section-header {
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      margin-bottom: 16px;
    }
    .section-title {
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .section-action {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
      color: var(--ink-4);
      cursor:pointer;
      transition: color 0.15s;
      background:none; border:none;
      padding:0;
    }
    .section-action:hover { color: var(--ink); }

    /* TWO-COL LAYOUT */
    .two-col {
      display:grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      margin-bottom: 28px;
    }

    /* PANEL */
    .panel {
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 22px;
      transition: box-shadow 0.2s;
    }
    .panel:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.05); }
    .panel-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }
    .panel-title {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0;
      color: var(--ink-2);
    }
    .panel-badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      background: var(--accent-lt);
      color: var(--accent);
      padding: 3px 9px;
      border-radius: 20px;
    }
    .panel-badge.warn {
      background: rgba(139,74,42,0.1);
      color: var(--warn);
    }

    /* TABLE */
    .data-table {
      width:100%;
      border-collapse:collapse;
      font-size: 0.78rem;
    }
    .data-table th {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0;
      text-transform: none;
      color: var(--ink-3);
      text-align:left;
      padding: 0 12px 10px;
      border-bottom: 1px solid var(--line);
      font-weight: 600;
    }
    .data-table td {
      padding: 12px;
      border-bottom: 1px solid rgba(0,0,0,0.04);
      color: var(--ink-2);
      vertical-align:middle;
    }
    .data-table tr:last-child td { border-bottom:none; }
    .data-table tr:hover td { background: var(--paper); }

    /* BUTTONS */
    .btn {
      font-family: 'Outfit', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink-2);
      padding: 7px 16px;
      border-radius: 6px;
      cursor:pointer;
      transition: all 0.15s;
      display:inline-flex;
      align-items:center;
      gap: 6px;
      letter-spacing: 0.01em;
    }
    .btn:hover { background: var(--ink); color: white; border-color: var(--ink); }
    .btn i { font-size:0.65rem; }
    .btn-ghost {
      background:transparent;
      border-color:transparent;
      color: var(--ink-3);
    }
    .btn-ghost:hover { background: var(--paper-2); color:var(--ink); border-color:transparent; }
    .btn-primary { background:var(--ink); color:var(--paper); border-color:var(--ink); }
    .btn-primary:hover { background: var(--ink-2); border-color:var(--ink-2); }

    /* BADGE */
    .badge {
      display:inline-flex;
      align-items:center;
      gap:5px;
      font-family:'DM Mono', monospace;
      font-size: 0.58rem;
      letter-spacing:0.08em;
      padding: 3px 8px;
      border-radius:4px;
      background: var(--paper-2);
      color: var(--ink-3);
    }
    .badge.green { background:rgba(74,103,65,0.1); color:var(--accent); }
    .badge.amber { background:rgba(180,130,40,0.1); color:#7a5a10; }
    .badge.red   { background:rgba(139,74,42,0.1); color:var(--warn); }
    .badge i { font-size:0.5rem; }

    /* ALERT ITEM */
    .alert-item {
      display:flex;
      align-items:flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .alert-item:last-child { border-bottom:none; }
    .alert-icon {
      width:28px; height:28px;
      border-radius:6px;
      display:flex; align-items:center; justify-content:center;
      font-size:0.7rem;
      flex-shrink:0;
      margin-top:1px;
    }
    .alert-icon.warn { background:rgba(139,74,42,0.1); color:var(--warn); }
    .alert-icon.info { background:var(--accent-lt); color:var(--accent); }
    .alert-icon.neutral { background:var(--paper-2); color:var(--ink-3); }
    .alert-body { flex:1; }
    .alert-title {
      font-size:0.8rem;
      font-weight:500;
      color:var(--ink);
      margin-bottom:2px;
    }
    .alert-meta {
      font-family: 'Inter', sans-serif;
      font-size: 0.7rem;
      color: var(--ink-4);
      margin-top: 2px;
    }

    /* CHART WRAPPER */
    .chart-wrap { position:relative; height:130px; width:100%; margin-top:8px; }

    /* INPUT */
    .field-row {
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom: 18px;
    }
    input, select, textarea {
      font-family:'Outfit',sans-serif;
      font-size: 0.78rem;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      padding: 8px 14px;
      border-radius: 6px;
      outline:none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--ink-3);
    }
    textarea { resize:vertical; width:100%; margin-bottom:10px; border-radius:8px; }

    /* GUIDE CARD */
    .guide-row {
      display:flex;
      align-items:center;
      gap:14px;
      padding:12px 0;
      border-bottom:1px solid var(--line);
    }
    .guide-row:last-child { border-bottom:none; }
    .guide-avatar {
      width:36px; height:36px;
      border-radius:50%;
      background:var(--ink);
      color:var(--paper);
      display:flex; align-items:center; justify-content:center;
      font-family:'Cormorant Garamond',serif;
      font-size:1rem;
      font-weight:600;
      flex-shrink:0;
    }
    .guide-info { flex:1; }
    .guide-name {
      font-size:0.82rem;
      font-weight:500;
      color:var(--ink);
    }
    .guide-meta {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      color: var(--ink-4);
      margin-top:2px;
    }

    /* FULL-SPAN */
    .full-span { margin-bottom:28px; }

    /* MOUNTAIN CARD GRID */
    .mtn-grid {
      display:grid;
      grid-template-columns: repeat(3,1fr);
      gap:14px;
      margin-bottom:24px;
    }
    .mtn-card {
      background:white;
      border:1px solid var(--line);
      border-radius:12px;
      padding:18px;
      cursor:pointer;
      transition:all 0.2s;
    }
    .mtn-card:hover {
      box-shadow:0 8px 20px rgba(0,0,0,0.08);
      transform:translateY(-2px);
    }
    .mtn-name {
      font-family:'Cormorant Garamond',serif;
      font-size:1.1rem;
      font-weight:600;
      color:var(--ink);
      margin-bottom:6px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .mtn-detail {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      color: var(--ink-4);
      line-height:1.7;
    }
    .mtn-actions {
      display:flex;
      gap:6px;
      margin-top:14px;
      padding-top:14px;
      border-top:1px solid var(--line);
    }

    /* ELEVATION BAR */
    .elev-bar {
      height:3px;
      background:var(--paper-3);
      border-radius:2px;
      margin:10px 0;
      overflow:hidden;
    }
    .elev-fill {
      height:100%;
      background:var(--ink);
      border-radius:2px;
    }

    /* ANALYTICS ROWS */
    .analytics-row {
      display:grid;
      grid-template-columns: repeat(3,1fr);
      gap:16px;
      margin-bottom:20px;
    }

    /* PAGE TRANSITION */
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .content > * { animation: fadeUp 0.28s ease forwards; }

  </style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div>
      <div class="logo">
        <div class="logo-wordmark">
          <div class="logo-icon">
            <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 22L10 10L14 16L18 8L24 22H4Z" fill="#1a1612" opacity="0.9"/>
              <path d="M14 16L18 8L24 22H14V16Z" fill="#1a1612" opacity="0.35"/>
            </svg>
          </div>
          LAKBAY
        </div>
        <div class="logo-sub">wilderness intelligence</div>
      </div>

      <div style="margin-bottom:8px; padding-left:28px;">
        <div class="nav-section-label">Navigation</div>
      </div>
      <ul class="nav-list">
        <li class="nav-item active" data-tab="dashboard"><i class="fas fa-chart-line"></i> Dashboard</li>
        <li class="nav-item" data-tab="mountains"><i class="fas fa-mountain"></i> Mountains</li>
        <li class="nav-item" data-tab="hikers"><i class="fas fa-person-hiking"></i> Hikers</li>
        <li class="nav-item" data-tab="guides"><i class="fas fa-chalkboard-user"></i> Guides</li>
        <div class="nav-divider"></div>
        <li class="nav-item" data-tab="payments"><i class="fas fa-coins"></i> Revenue</li>
        <li class="nav-item" data-tab="alerts"><i class="fas fa-bell"></i> Alerts</li>
        <li class="nav-item" data-tab="analytics"><i class="fas fa-chart-simple"></i> Analytics</li>
      </ul>
    </div>
    <div class="sidebar-footer">
      <div class="status-dot"></div>
      SYSTEM LIVE · V3
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="page-heading" id="pageHeading"><i class="fas fa-chart-line"></i> Dashboard</div>
      <div class="topbar-right">
        <div class="topbar-date" id="liveDate"></div>
        <div class="topbar-user">
          <div class="avatar">D</div>
          Director <i class="fas fa-chevron-down" style="font-size:0.5rem; color:var(--ink-4);"></i>
        </div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>

</div>

<script>
// ─── LIVE DATE ───────────────────────────────────────────────────────────────
function updateDate() {
  const d = new Date();
  document.getElementById('liveDate').textContent =
    d.toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'}).toUpperCase() +
    '  ' + d.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'});
}
updateDate(); setInterval(updateDate, 1000);

// ─── CHARTS ──────────────────────────────────────────────────────────────────
let charts = {};
function clearCharts() {
  Object.values(charts).forEach(c => c?.destroy());
  charts = {};
}
function buildChart(id, type, data, opts = {}) {
  const ctx = document.getElementById(id);
  if (!ctx) return;
  charts[id] = new Chart(ctx, {
    type,
    data,
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { enabled: true } },
      scales: {
        x: { grid:{ display:false }, ticks:{ font:{ family:"'DM Mono'", size:9 }, color:'#a0917f' } },
        y: { display: false }
      },
      ...opts
    }
  });
}

// ─── TABS ────────────────────────────────────────────────────────────────────
const PAGE_TITLES = {
  dashboard: ['fa-chart-line','Dashboard'],
  mountains:  ['fa-mountain','Mountains'],
  hikers:     ['fa-person-hiking','Hikers'],
  guides:     ['fa-chalkboard-user','Guides'],
  payments:   ['fa-coins','Revenue'],
  alerts:     ['fa-bell','Alerts'],
  analytics:  ['fa-chart-simple','Analytics'],
};

let currentTab = 'dashboard';
function loadTab(tab) {
  currentTab = tab;
  clearCharts();
  const [icon, title] = PAGE_TITLES[tab];
  document.getElementById('pageHeading').innerHTML = `<i class="fas ${icon}"></i> ${title}`;
  const content = document.getElementById('content');
  content.innerHTML = TABS[tab]();
  attachEvents(tab);
  requestAnimationFrame(() => requestAnimationFrame(() => initTabCharts(tab)));
}

function initTabCharts(tab) {
  if (tab === 'dashboard') {
    buildChart('chartRevenue','line',{
      labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
      datasets:[{ data:[12800,14500,13200,16800,22400,27800,25400], borderColor:'#1a1612', backgroundColor:'rgba(26,22,18,0.04)', tension:0.4, fill:true, pointRadius:3, pointBackgroundColor:'#1a1612', borderWidth:1.5 }]
    });
    buildChart('chartActivity','bar',{
      labels:['Wk 1','Wk 2','Wk 3','Wk 4'],
      datasets:[{ data:[42,58,51,66], backgroundColor:'rgba(26,22,18,0.12)', borderRadius:4 }]
    });
  }
  if (tab === 'mountains') {
    buildChart('chartCrowd','bar',{
      labels:['Apo','Pulag','Makiling','Batulao','Daraitan'],

// ─── EVENT BINDING ───────────────────────────────────────────────────────────
function attachEvents(tab) {
  const $ = id => document.getElementById(id);

  const simple = (id, msg) => {
    const el = $(id);
    if (el) el.addEventListener('click', () => alert(msg));
  };

  const allBtns = (cls, fn) => {
    document.querySelectorAll(cls).forEach(b => b.addEventListener('click', fn));
  };

  if (tab === 'dashboard') {
    simple('refreshStatsBtn', '📊 Stats refreshed.');
    simple('viewAllBookings', '📋 Opening full bookings list…');
    simple('ackAlertBtn', '✅ Alert acknowledged.');
    simple('viewAlertBtn', '🔔 Opening alert details…');
    allBtns('.viewBookBtn', e => alert(`📋 Booking details for ${e.currentTarget.dataset.name}.`));
  }
  if (tab === 'mountains') {
    simple('addMtnBtn', '🏔 Add mountain form — difficulty, fees, elevation, seasonal limits.');
    simple('heatmapBtn', '🔥 Full interactive crowd heatmap (map view).');
    allBtns('.edit-mtn-btn', () => alert('✏️ Edit mountain settings.'));
    allBtns('.approv-mtn-btn', () => alert('✅ Approval submitted.'));
  }
  if (tab === 'hikers') {
    simple('applyFilterBtn', '🔍 Filter applied.');
    allBtns('.histBtn', e => alert(`📜 History for ${e.currentTarget.dataset.hiker}: 4 past treks.`));
    allBtns('.editHikerBtn', () => alert('✏️ Edit hiker profile.'));
  }
  if (tab === 'guides') {
    simple('addGuideBtn', '➕ Add new guide form.');
    simple('broadcastBtn', () => alert('📢 Broadcast to guides.'));
    simple('sendAnnounceBtn', () => {
      const msg = $('announceTxt')?.value;
      alert(`📢 Sent: "${msg}"`);
    });
    allBtns('.msgGuideBtn', e => alert(`💬 Messaging ${e.currentTarget.dataset.guide}.`));
  }
  // fix announce btn — direct binding after DOM ready
  const sab = $('sendAnnounceBtn');
  if (sab) sab.onclick = () => { const v = $('announceTxt')?.value; alert(`📢 Announcement sent:\n"${v}"`); };

  if (tab === 'payments') {
    simple('genReportBtn', '📑 Generating PDF revenue report…');
  }
  if (tab === 'alerts') {
    simple('ackAlert1', '✅ Rainfall alert acknowledged.');
    simple('ackAlert2', '✅ Medical alert acknowledged.');
    simple('resolveAllBtn', '✅ All alerts marked resolved.');
    simple('sendBroadcastBtn', () => {
      const msg = $('broadcastTxt')?.value;
      alert(`🔔 Broadcast sent:\n"${msg}"`);
    });
    simple('previewBroadcastBtn', '👁 Preview notification.');
    // direct bind
    const sbb = $('sendBroadcastBtn');
    if (sbb) sbb.onclick = () => { const v = $('broadcastTxt')?.value; alert(`🔔 Sent:\n"${v}"`); };
  }
  if (tab === 'analytics') {
    simple('refreshAnalyticsBtn', '📈 Analytics refreshed.');
  }
}

// ─── NAV ─────────────────────────────────────────────────────────────────────
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    item.classList.add('active');
    const tab = item.dataset.tab;
    if (tab) loadTab(tab);
  });
});

loadTab('dashboard');
</script>
</body>
</html>
