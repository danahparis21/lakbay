<!-- SHARED NAV SCRIPT: add to every page -->
<script>
// Mark active nav item based on current page
(function() {
  const page = document.body.dataset.page;
  document.querySelectorAll('.nav-item').forEach(item => {
    if (item.dataset.tab === page) item.classList.add('active');
    item.addEventListener('click', () => {
      window.location.href = item.dataset.tab + '.html';
    });
  });

  // Live clock
  function updateDate() {
    const el = document.getElementById('liveDate');
    if (!el) return;
    const d = new Date();
    el.textContent =
      d.toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'}).toUpperCase() +
      '  ' + d.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'});
  }
  updateDate(); setInterval(updateDate, 1000);
})();
</script>
